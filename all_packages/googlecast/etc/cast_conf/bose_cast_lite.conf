{
  "cast_core": {
    // Logging configuration.
    "logging": {
      // Enable\disable log to stderr.
      "stderr": true,
      // Log file location. Set to empty value to disable logging to a file and
      // log rotation.
      "file": "/tmp/cast/cast.log",
      // Maximum log file size in kB before archiving. Minimum value is 128kB.
      "max_log_size_kb": 1024,
      // Path to log archives. Set to empty value to disable log archiving.
      "archives_path": "/tmp/cast/archives",
      // Number of maximum log archives to keep (will delete the old archives).
      "max_archives": 2,
      // Log archive cleanup frequency in seconds.
      "archive_cleanup_frequency_seconds": 180
    },
    // Device folder structure settings.
    "base_paths": {
      // Path to assets folder - must exist. Missing\Empty value bypasses the
      // override.
      "assets": "/opt/Bose/bin/assets",
      // Path to HOME folder - must exist. Missing\Empty value bypasses the
      // override.
      "home": "/mnt/nv/product-persistence/google-cast-library",
      // Path to GVA HOME folder, if available. Missing\Empty\Invalid value
      // bypasses the override.
      "assistant_home": "/mnt/nv/product-persistence/google-assistant-library",
      // Path to TEMP folder - must exist. Missing\Empty value bypasses the
      // override.
      "temp": "/tmp/"
    },
    // Crash reporting settings.
    "crash_settings": {
      // Path to crash dumps - must exist.
      "crash_dump_path": "/tmp/cast/minidumps",
      // OEM should modify this path to point to crash_uploader binary.
      "crash_uploader_path": "/opt/Bose/bin/cast_crash_uploader",
      "crash_uploader_daemon": false
    },
    // HTTP cache settings.
    "http": {
      // Path to HTTP cache files.
      "cache_path": "/tmp/cast/http/cache",
      // Path to cookie cache files.
      "cookies_path": "/tmp/cast/http/cookies",
      // Maximum cache size in megabytes. The cache is disabled if it is 0.
      "max_cache_size_mb": 10
    },
    // i18n settings - eg. locales, timezones.
    "i18n": {
      // Locales for languages to be shown in GHA
      "locales": ["en-US", "es", "fr"]
    }
  },
  // Settings that can be used to tune the performance of a runtime.
  "runtime": {
    // Maximum memory size (in mb) allocated to a javascript runtime.
    "js_memory_limit_mb": 30
  },
  // To enable/disable background apps.
  "enable_background_apps": true,
  // Represents the environment in which the device is running.
  // Valid values are hotel, home, automotive.
  // Shared/Public Device Environments [hotel]
  // Private/Consumer Device Environments [home, automotive]
  "device_environment": "home"
}
