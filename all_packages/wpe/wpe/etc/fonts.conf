<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
	<dir>/opt/Bose/wpe/share/fonts</dir>
	<dir prefix="xdg">fonts</dir>
	<cachedir>/var/cache/fontconfig</cachedir>
	<cachedir prefix="xdg">fontconfig</cachedir>

	<!-- Support a "mono" alias for "monospace" -->
	<match target="pattern">
		<test qual="any" name="family"><string>mono</string></test>
		<edit name="family" mode="assign"><string>monospace</string></edit>
	</match>

	<!-- Always fall-back to "sans" for fonts without a generic name -->
	<match target="pattern">
		<test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
		<test qual="all" name="family" compare="not_eq"><string>serif</string></test>
		<test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
		<edit name="family" mode="append_last"><string>sans</string></edit>
	</match>

	<!-- Fall-back to Vera Sans/Serif/Mono -->
	<match>
		<test name="family"><string>sans-serif</string></test>
		<edit name="family" mode="prepend"><string>Bitstream Vera Sans</string></edit>
	</match>
	<match>
		<test name="family"><string>serif</string></test>
		<edit name="family" mode="prepend"><string>Bitstream Vera Serif</string></edit>
	</match>
	<match>
		<test name="family"><string>monospace</string></test>
		<edit name="family" mode="prepend"><string>Bitstream Vera Mono</string></edit>
	</match>
</fontconfig>
